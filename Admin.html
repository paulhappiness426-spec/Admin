<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Match Admin</title>
<style>
body{font-family:Arial;background:#1a0533;color:#fff;padding:15px}
h2{text-align:center}
.box{background:#fff;color:#222;border-radius:16px;padding:14px;margin:10px 0}
button{padding:10px 14px;border:none;border-radius:20px;font-weight:800;cursor:pointer;margin:3px}
.paid{background:#00c853;color:#fff}
.reject{background:#ff1744;color:#fff}
input{padding:10px;border-radius:12px;border:1px solid #ccc;width:90%}
</style>
</head>
<body>
<h2>🍬 Candy Match Admin</h2>
<div style="text-align:center">
<button onclick="load('pending')" style="background:#ffb300">Pending</button>
<button onclick="load('paid')" style="background:#00c853;color:#fff">Paid</button>
<button onclick="load('rejected')" style="background:#ff1744;color:#fff">Rejected</button>
<button onclick="load('all')" style="background:#fff">All</button>
</div>
<div id="list"></div>
<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const BOT_TOKEN="YOUR_BOT_TOKEN";

async function req(path,method,body){
  let res=await fetch(SUPABASE_URL+"/rest/v1/"+path,{method:method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=representation"},body:body?JSON.stringify(body):null});
  return await res.json();
}

async function notifyUser(telegramId, msg){
  if(!telegramId || telegramId.startsWith("manual_")) return;
  try{
    await fetch("https://api.telegram.org/bot"+BOT_TOKEN+"/sendMessage",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({chat_id: telegramId, text: msg})
    });
  }catch(e){}
}

async function load(status){
  let q="withdrawals?order=created_at.desc&select=*";
  if(status!=="all") q="withdrawals?status=eq."+status+"&order=created_at.desc&select=*";
  let data=await req(q,"GET");
  let html="";
  if(!data || data.length===0) html="<div class='box'>No withdrawals</div>";
  data.forEach(w=>{
    html+=`<div class='box'>
    <b>${w.username||""}</b> • ${w.user_code||""}<br>
    🪙 ${w.amount_coins} Coins = $${w.amount_usd}<br>
    Method: <b>${w.method||""}</b><br>
    Wallet/Acct: <b>${w.wallet||""}</b><br>
    Name: ${w.account_name||""} | Bank: ${w.bank_name||""}<br>
    Status: <b>${w.status}</b> • ${new Date(w.created_at).toLocaleString()}<br>
    <button class='paid' onclick="markPaid('${w.id}','${w.telegram_id}','${w.amount_coins}','${w.amount_usd}','${w.method}')">✅ Mark Paid</button>
    <button class='reject' onclick="markReject('${w.id}','${w.telegram_id}')">❌ Reject</button>
    </div>`;
  });
  document.getElementById("list").innerHTML=html;
}

async function markPaid(id, telegramId, coins, usd, method){
  await req("withdrawals?id=eq."+id,"PATCH",{status:"paid"});
  await notifyUser(telegramId, "✅ Withdrawal Paid!\n\n🪙 Coins: "+coins+"\n💵 Amount: $"+usd+"\nMethod: "+method+"\n\nThanks for playing Candy Match! 🍬");
  alert("Marked Paid + User Notified on Telegram");
  load('pending');
}

async function markReject(id, telegramId){
  await req("withdrawals?id=eq."+id,"PATCH",{status:"rejected"});
  await notifyUser(telegramId, "❌ Withdrawal Rejected\n\nYour withdrawal was rejected. Please check your wallet details and try again. Contact @candymatchcommunity for help.");
  alert("Rejected + User Notified");
  load('pending');
}

load('pending');
</script>
</body>
</html>
